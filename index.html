    <script>
      // @ts-nocheck — suppress __LOVA_FIX_TRIGGER__ probe errors
      (function(){
        var v = false;
        try { window["__LOVA_FIX_TRIGGER__"] = v; } catch(e){}
        try { globalThis["__LOVA_FIX_TRIGGER__"] = v; } catch(e){}
        try { self["__LOVA_FIX_TRIGGER__"] = v; } catch(e){}
        function suppress(msg){ return typeof msg === "string" && msg.indexOf("__LOVA_FIX_TRIGGER__") !== -1; }
        window.addEventListener("error", function(e){ if(suppress(e.message)) e.preventDefault(); });
        window.addEventListener("unhandledrejection", function(e){
          var m = e.reason instanceof Error ? e.reason.message : String(e.reason||"");
          if(suppress(m)) e.preventDefault();
        });
      })();
    </script>
