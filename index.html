      var __LOVA_FIX_TRIGGER__ = false;
      (function () {
        var FIX_KEY = "__LOVA_FIX_TRIGGER__";
        var BOOTSTRAP_VERSION = "v11";
        var BOOTSTRAP_STORAGE_KEY = "__lova_bootstrap_fix__";
        var MODULE_SRC = "/src/main.tsx?bootstrap=" + BOOTSTRAP_VERSION;

        function defineFix(scope) {
          if (!scope) return;
          try { scope[FIX_KEY] = false; } catch (e) {}
          try {
            Object.defineProperty(scope, FIX_KEY, {
              value: false,
              writable: true,
              configurable: true,
            });
          } catch (e) {}
        }

        defineFix(window);
        defineFix(globalThis);
        try { defineFix(self); } catch (e) {}
        try { (0, eval)("var " + FIX_KEY + " = false"); } catch (e) {}

        function isFixError(value) {
          return String(value || "").indexOf(FIX_KEY) !== -1;
        }

        window.addEventListener(
          "error",
          function (event) {
            if (isFixError((event && event.message) || "") || isFixError(event && event.error && event.error.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );

        window.addEventListener(
          "unhandledrejection",
          function (event) {
            try {
              var reason = event && event.reason;
              var message = reason instanceof Error ? reason.message : String(reason || "");
              if (isFixError(message)) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            } catch (e) {}
          },
          true,
        );

        async function clearStaleRuntime() {
          var storage;
          try {
            storage = window.sessionStorage;
            if (storage.getItem(BOOTSTRAP_STORAGE_KEY) === BOOTSTRAP_VERSION) return;
            storage.setItem(BOOTSTRAP_STORAGE_KEY, BOOTSTRAP_VERSION);
          } catch (e) {}

          try {
            if ("serviceWorker" in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (registration) {
                return registration.unregister().catch(function () {
                  return false;
                });
              }));
            }
          } catch (e) {}

          try {
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (key) {
                return caches.delete(key).catch(function () {
                  return false;
                });
              }));
            }
          } catch (e) {}
        }

        async function boot() {
          await clearStaleRuntime();
          var script = document.createElement("script");
          script.type = "module";
          script.src = MODULE_SRC;
          document.body.appendChild(script);
        }

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            function () {
              void boot();
            },
            { once: true },
          );
        } else {
          void boot();
        }
      })();
